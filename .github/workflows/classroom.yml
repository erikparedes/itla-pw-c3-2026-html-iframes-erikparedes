name: Autograding Tests
'on':
  push:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: [self-hosted, oracle]
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    # Cachear node_modules
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Instalar dependencias
      run: npm install
    
    - name: Ejercicio 1 - Estructura Básica y Primer Iframe
      id: ejercicio-1
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 1 - Estructura Básica y Primer Iframe
        setup-command: ''
        command: npm test tests/ejercicio/1-estructura-basica-iframe.test.js
        timeout: 30
        max-score: 25
    
    - name: Ejercicio 2 - Iframe de Video (YouTube)
      id: ejercicio-2
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 2 - Iframe de Video (YouTube)
        setup-command: ''
        command: npm test tests/ejercicio/2-iframe-video.test.js
        timeout: 30
        max-score: 25
    
    - name: Ejercicio 3 - Iframe de Mapa y Múltiples Contenidos
      id: ejercicio-3
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 3 - Iframe de Mapa y Múltiples Contenidos
        setup-command: ''
        command: npm test tests/ejercicio/3-iframe-mapa.test.js
        timeout: 30
        max-score: 25
    
    - name: Ejercicio 4 - Optimización y Seguridad en Iframes
      id: ejercicio-4
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ejercicio 4 - Optimización y Seguridad en Iframes
        setup-command: ''
        command: npm test tests/ejercicio/4-optimizacion-seguridad.test.js
        timeout: 30
        max-score: 25
    
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        EJERCICIO-1_RESULTS: "${{steps.ejercicio-1.outputs.result}}"
        EJERCICIO-2_RESULTS: "${{steps.ejercicio-2.outputs.result}}"
        EJERCICIO-3_RESULTS: "${{steps.ejercicio-3.outputs.result}}"
        EJERCICIO-4_RESULTS: "${{steps.ejercicio-4.outputs.result}}"
      with:
        runners: ejercicio-1,ejercicio-2,ejercicio-3,ejercicio-4

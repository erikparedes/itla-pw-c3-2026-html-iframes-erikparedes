<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Galería de Iframes</title>
</head>
<body>
    <h1>Galería de Iframes</h1>
    <p>
        En esta galería se incrustan tres tipos de contenido distintos: un mapa de Google Maps, un artículo de
        Wikipedia y una página educativa de referencia.
    </p>

    <h2>Mapa: ITLA, Santo Domingo Este</h2>
    <iframe src="https://www.google.com/maps?q=Instituto+Tecnol%C3%B3gico+de+las+Am%C3%A9ricas+ITLA&amp;output=embed" title="Mapa del Instituto Tecnológico de las Américas (ITLA)" width="600" height="400"></iframe>

    <h2>Wikipedia: HTML</h2>
    <iframe src="https://es.wikipedia.org/wiki/HTML" title="Artículo de Wikipedia sobre HTML" width="600" height="400"></iframe>

    <h2>Página educativa: libro de HTML en Wikilibros</h2>
    <iframe src="https://es.wikibooks.org/wiki/Lenguaje_HTML" title="Libro educativo de HTML en Wikilibros" width="600" height="400"></iframe>
</body>
</html>

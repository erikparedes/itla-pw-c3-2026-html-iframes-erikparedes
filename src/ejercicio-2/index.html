<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Iframes de Video</title>
</head>
<body>
    <h1>Iframes de Video</h1>
    <p>
        Esta página muestra cómo incrustar videos de YouTube y Vimeo usando iframes con sus URLs de embed y el
        atributo allowfullscreen para permitir la pantalla completa.
    </p>

    <h2>Video 1: YouTube</h2>
    <iframe src="https://www.youtube.com/embed/iFToyCXIktE?si=jqYtMwwI6d4OM-xI" title="Video de YouTube incrustado en la página" width="560" height="315" allowfullscreen></iframe>

    <h2>Video 2: Vimeo</h2>
    <iframe src="https://player.vimeo.com/video/76979871" title="Video de Vimeo incrustado en la página" width="560" height="315" allowfullscreen></iframe>
</body>
</html>

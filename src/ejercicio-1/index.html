<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Mi Primer Iframe</title>
</head>
<body>
    <h1>Mi Primer Iframe</h1>
    <p>
        Un iframe (marco en línea) es un elemento de HTML que permite mostrar otra página web dentro de la
        página actual, como si fuera una ventana hacia otro sitio.
    </p>

    <iframe src="https://es.wikipedia.org/wiki/HTML" title="Artículo de Wikipedia sobre HTML" width="600" height="400"></iframe>
</body>
</html>
